name: fairly-backend
services:
  nginx:
    pull_policy: never
    build:
      dockerfile: containers/Dockerfile
      target: nginx_development
    restart: on-failure
    ports:
      - '80:80'
    depends_on:
      - php
    volumes_from:
      - php
    environment:
      FPM_HOST: php
      FPM_PORT: 9000
  php:
    pull_policy: never
    build:
      dockerfile: containers/Dockerfile
      target: php_development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: on-failure
    depends_on:
      - database
    environment:
      XDEBUG_CONFIG: 'client_host=host.docker.internal'
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - .:/var/www/html
  database:
    image: postgres:18-alpine
    restart: on-failure
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: laravel
    volumes:
      - database:/var/lib/postgresql
    ports:
      - '5432:5432'
